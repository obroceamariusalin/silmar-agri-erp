<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Silmar Agri ERP</title>
  <meta name="theme-color" content="#12372a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="modulepreload" href="/js/app.js">
</head>
<body>
  <div class="boot" aria-hidden="true"><div class="brand-logo"><i class="bi bi-flower1"></i></div></div>

  <div class="app">
    <aside class="sidebar" aria-label="Meniu principal">
      <div class="brand">
        <div class="brand-logo"><i class="bi bi-flower1"></i></div>
        <div><div class="brand-name">SILMAR</div><div class="brand-sub">Agri ERP · Solution SRL</div></div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="#/dashboard" data-route="dashboard"><i class="bi bi-grid-1x2"></i>Dashboard</a>
        <a class="nav-item" href="#/plati" data-route="plati"><i class="bi bi-cash-stack"></i>Plăți arendă</a>
        <a class="nav-item" href="#/arendasi" data-route="arendasi"><i class="bi bi-people"></i>Arendași</a>
        <a class="nav-item" href="#/terenuri" data-route="terenuri"><i class="bi bi-map"></i>Terenuri</a>
        <a class="nav-item" href="#/jurnal" data-route="jurnal"><i class="bi bi-journal-text"></i>Jurnal câmp</a>
      </nav>
      <div class="nav-label">Documente</div>
      <nav class="nav">
        <button class="nav-item" data-global="contract"><i class="bi bi-lightning-charge"></i>Contract rapid</button>
        <button class="nav-item" data-global="primarie"><i class="bi bi-file-earmark-word"></i>Tabel primărie</button>
        <button class="nav-item" data-global="borderou"><i class="bi bi-file-earmark-excel"></i>Borderou Excel</button>
      </nav>
      <div class="sidebar-footer"><div class="user-card" id="user-card"></div></div>
    </aside>
    <div class="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menu-btn" aria-label="Meniu"><i class="bi bi-list" style="font-size:22px"></i></button>
        <div class="topbar-title"><h1 id="page-title">Dashboard</h1><p id="page-sub"></p></div>
        <div class="topbar-actions">
          <select class="select select-sm" id="an-agricol" aria-label="An agricol" style="width:auto"></select>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>

    <nav class="bottom-nav" aria-label="Navigare rapidă">
      <a href="#/dashboard" data-route="dashboard"><i class="bi bi-grid-1x2"></i>Acasă</a>
      <a href="#/plati" data-route="plati"><i class="bi bi-cash-stack"></i>Plăți</a>
      <a href="#/arendasi" data-route="arendasi"><i class="bi bi-people"></i>Arendași</a>
      <a href="#/terenuri" data-route="terenuri"><i class="bi bi-map"></i>Terenuri</a>
      <a href="#/jurnal" data-route="jurnal"><i class="bi bi-journal-text"></i>Jurnal</a>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
